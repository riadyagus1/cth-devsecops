name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Code Quality Check (Pylint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pylint
        run: |
          # Memeriksa file python dan fail jika skor < 8
          pylint $(git ls-files '*.py') --fail-under=8

  deploy:
    name: Deploy to Server
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment script over SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/cth-devsecops
            git pull origin main

            # Reload PHP-FPM untuk membersihkan cache opcache
            sudo systemctl reload php8.3-fpm || truename: CI/CD Pipeline

